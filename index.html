<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <aside class="left-panel">
            
            <div class="logo-banner">
                    <img src="odin-lined.png" alt="Logo">
                    <h1>ODIN</h1>
            </div>
            
            <p>Photo by Chloe Hradek</p>
            
        </aside>
        

        <section class="right-panel">

            <header class="intro">
                <p> This is not a real online service. Please do not put your real personal information such as email and password.</p>
                <p> You know you want to.</p>
            </header>

            <form>

                <fieldset>

                    <h3>Let's do this!</h3>
                    
                    <div class="input-group">
                        <label for="firstName"> FIRST NAME </label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>

                    <div class="input-group">
                        <label for="lastName"> LAST NAME </label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone">
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" required minlength="8">
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">CONFIRM PASSWORD</label>
                        <input type="password" id="confirmPassword" required minlength="8">
                    </div>

                </fieldset>

                <button>Create Account</button>
                
            </form>

            <p class="account">Already have an account? <a href="#">Log in</a> </p>
        
        </section>

    </main>

</body>
</html>
